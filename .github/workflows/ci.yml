name: CI workflow

on:
  push:
    branches:
      - dev
      - sit
      - uat
      - preprod
      - main

jobs:
  workflow_call_build:
    uses: tidlor-ins/insplatform-workflow-template/.github/workflows/build-web.yml@beta
    secrets: inherit
    with:
      imagename: cmiwl-portal-web

  update_manifest:
    needs: workflow_call_build
    uses:  tidlor-ins/insplatform-workflow-template/.github/workflows/set-deployment.yml@v1.0.2
    secrets: inherit
    with:
      imagename: ${{ needs.workflow_call_build.outputs.imgname }}
      repository: tidlor-ins/cmi-deployment
      domain: src/microservices/oncloud/portal-web